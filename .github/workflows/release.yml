name: Release

# Publishes @gantt-chart/* to npm via trusted publishing (OIDC) — no npm token.
# Each package must have this workflow registered as its trusted publisher at
# https://www.npmjs.com/package/<name>/access

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint the OIDC token npm exchanges for a publish grant

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # No NODE_AUTH_TOKEN: auth comes from OIDC at publish time.
          # No `cache:` either — release builds should not restore a cache.

      # Trusted publishing needs npm >= 11.5.1; don't rely on what Node bundles.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # Packages version independently now (a themes-only fix shouldn't force
      # a react/core/echarts bump too). This is just a sanity check that a
      # pushed tag corresponds to an actual bump, not a lockstep requirement.
      - name: Check tag matches a package version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Not a tag push (workflow_dispatch) — skipping tag check."
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          match=false
          for pkg in core themes echarts react; do
            version=$(node -p "require('./packages/gantt-$pkg/package.json').version")
            if [ "$version" = "$tag_version" ]; then
              echo "@gantt-chart/$pkg is $version — matches tag $GITHUB_REF_NAME"
              match=true
            fi
          done
          if [ "$match" != true ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match any package version"
            exit 1
          fi

      # Dependency order: core -> themes -> echarts -> react.
      # Already-published versions are skipped so a re-run after a partial
      # failure resumes instead of erroring on E403 version-exists.
      - name: Publish
        run: |
          # Default shell is `bash -e` without pipefail; `tee` below would
          # otherwise swallow a non-zero exit from npm publish.
          set -o pipefail
          for pkg in core themes echarts react; do
            name="@gantt-chart/$pkg"
            version=$(node -p "require('./packages/gantt-$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
              continue
            fi
            echo "Publishing $name@$version"
            # Publish from inside the package rather than with `-w`: the OIDC
            # token npm mints is scoped to the package in the working directory.
            if ! (cd "packages/gantt-$pkg" && npm publish 2>&1 | tee /tmp/publish.log); then
              # Surface the reason in the job summary — run logs need auth to read.
              {
                echo "### Publish failed: \`$name@$version\`"
                echo
                echo '```'
                tail -n 40 /tmp/publish.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
